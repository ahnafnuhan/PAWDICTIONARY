<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | PAWDICTIONARY</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><span class="logo-paw">PAW</span><span class="logo-dictionary">DICTIONARY</span><span class="logo-dot">.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cats.html">Cats</a></li>
                <li><a href="dogs.html">Dogs</a></li>
                <li><a href="my_cat.html">My Cat</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="pettalk.html">PetTalk</a></li>
                <li class="nav-sign-up"><a href="account.html">My Account</a></li>
            </ul>
        </nav>
    </header>

    <main class="account-page">
        <section class="account-card" aria-labelledby="account-title">
            <p class="account-status">Logged in</p>
            <h1 id="account-title">Welcome to your account</h1>
            <p id="account-welcome">Loading your account details...</p>

            <div class="profile-photo-section">
                <img id="profile-avatar" class="profile-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='38' r='18' fill='%23cbd2c4'/%3E%3Cpath d='M18 92a32 32 0 0 1 64 0' fill='%23cbd2c4'/%3E%3C/svg%3E" alt="Profile picture">
                <label class="profile-upload-button" for="profile-picture">
                    Choose profile picture
                </label>
                <input id="profile-picture" type="file" accept="image/*" hidden>
                <button class="profile-remove-button" id="remove-profile-picture" type="button" hidden>Remove picture</button>
                <p class="upload-message" id="profile-message" aria-live="polite"></p>
            </div>

            <div class="account-details" id="account-details" hidden>
                <div class="account-detail">
                    <strong>Name</strong>
                    <span id="account-name">-</span>
                </div>
                <div class="account-detail">
                    <strong>Email</strong>
                    <span id="account-email">-</span>
                </div>
                <div class="account-detail">
                    <strong>User ID</strong>
                    <span id="account-id">-</span>
                </div>
                <div class="account-detail">
                    <strong>Provider</strong>
                    <span id="account-provider">-</span>
                </div>
            </div>

            <div class="account-actions">
                <a class="primary-btn" href="index.html">Visit Website</a>
                <button id="signout-button" type="button">Sign Out</button>
            </div>

            <div class="pet-profile">
                <div class="pet-profile-heading">
                    <div>
                        <p class="subtitle">MY PETS</p>
                        <h2>Pet Showcase</h2>
                    </div>
                    <label class="profile-upload-button" for="pet-photo">
                        Add pet photo
                    </label>
                    <input id="pet-photo" type="file" accept="image/*" hidden>
                </div>
                <p class="upload-message" id="pet-message" aria-live="polite"></p>
                <div class="pet-photo-grid" id="pet-photo-grid"></div>
            </div>
        </section>
    </main>

    <footer>
        <h3>PAWDICTIONARY.</h3>
        <p>Discover. Learn. Care.</p>
    </footer>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://huqlhlxukomrozoymvdh.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dPY3CDRcFiCKG3HStHQbOA_w6mBHuBR";
        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const { data: { session } } = await supabase.auth.getSession();

        if (!session) {
            window.location.replace("auth.html#signin");
        } else {
            const user = session.user;
            const metadata = user.user_metadata || {};
            const name = metadata.name || metadata.full_name || "Pet community member";
            const provider = user.app_metadata?.provider || "email";
            const storageBucket = "site-images";
            const maxUploadSize = 10 * 1024 * 1024;

            document.querySelector("#account-welcome").textContent = `Hello, ${name}. You are successfully logged in.`;
            document.querySelector("#account-name").textContent = name;
            document.querySelector("#account-email").textContent = user.email || "-";
            document.querySelector("#account-id").textContent = user.id;
            document.querySelector("#account-provider").textContent = provider;
            document.querySelector("#account-details").hidden = false;

            if (metadata.avatar_url) {
                document.querySelector("#profile-avatar").src = metadata.avatar_url;
                document.querySelector("#remove-profile-picture").hidden = false;
            }

            document.querySelector("#profile-picture").addEventListener("change", async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const message = document.querySelector("#profile-message");
                message.textContent = "Uploading...";

                try {
                    if (!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
                    if (file.size > maxUploadSize) throw new Error("Please choose an image smaller than 10 MB.");

                    const extension = file.name.split(".").pop()?.toLowerCase() || "jpg";
                    const path = `${user.id}/avatar.${extension}`;
                    const { error: uploadError } = await supabase.storage
                        .from(storageBucket)
                        .upload(path, file, { upsert: true, cacheControl: "3600" });
                    if (uploadError) throw uploadError;

                    const { data } = supabase.storage.from(storageBucket).getPublicUrl(path);
                    const avatarUrl = `${data.publicUrl}?t=${Date.now()}`;
                    const { error: updateError } = await supabase.auth.updateUser({
                        data: { avatar_url: avatarUrl },
                    });
                    if (updateError) throw updateError;

                    document.querySelector("#profile-avatar").src = avatarUrl;
                    document.querySelector("#remove-profile-picture").hidden = false;
                    message.textContent = "Profile picture updated.";
                } catch (error) {
                    message.textContent = `Upload failed: ${error.message}`;
                }
            });

            const petGrid = document.querySelector("#pet-photo-grid");
            const petMessage = document.querySelector("#pet-message");

            async function loadPetPhotos() {
                petGrid.replaceChildren();
                const files = [];
                let offset = 0;

                while (true) {
                    const { data, error } = await supabase.storage
                        .from(storageBucket)
                        .list(`${user.id}/pets`, {
                            limit: 100,
                            offset,
                            sortBy: { column: "created_at", order: "desc" },
                        });

                    if (error) {
                        petMessage.textContent = `Could not load account photos: ${error.message}`;
                        return;
                    }

                    if (!data?.length) break;
                    files.push(...data);
                    if (data.length < 100) break;
                    offset += data.length;
                }

                files.forEach((file) => {
                    if (!file.name) return;
                    const { data } = supabase.storage
                        .from(storageBucket)
                        .getPublicUrl(`${user.id}/pets/${file.name}`);

                    const figure = document.createElement("figure");
                    const image = document.createElement("img");
                    image.src = data.publicUrl;
                    image.alt = "My pet";
                    figure.appendChild(image);
                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.className = "pet-photo-delete";
                    deleteButton.textContent = "Delete";
                    deleteButton.addEventListener("click", async () => {
                        const { error: removeError } = await supabase.storage
                            .from(storageBucket)
                            .remove([`${user.id}/pets/${file.name}`]);
                        if (removeError) {
                            petMessage.textContent = removeError.message;
                            return;
                        }
                        petMessage.textContent = "Pet photo deleted.";
                        await loadPetPhotos();
                    });
                    figure.appendChild(deleteButton);
                    petGrid.appendChild(figure);
                });

                petMessage.textContent = files.length ? "" : "No pet photos uploaded yet.";
            }

            document.querySelector("#pet-photo").addEventListener("change", async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                petMessage.textContent = "Uploading pet photo...";

                try {
                    if (!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
                    if (file.size > maxUploadSize) throw new Error("Please choose an image smaller than 10 MB.");

                    const extension = file.name.split(".").pop()?.toLowerCase() || "jpg";
                    const uploadId = crypto.randomUUID
                        ? crypto.randomUUID()
                        : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
                    const path = `${user.id}/pets/${uploadId}.${extension}`;
                    const { error: uploadError } = await supabase.storage
                        .from(storageBucket)
                        .upload(path, file, { cacheControl: "3600" });
                    if (uploadError) throw uploadError;

                    petMessage.textContent = "Pet photo saved to your account.";
                    event.target.value = "";
                    await loadPetPhotos();
                } catch (error) {
                    petMessage.textContent = `Upload failed: ${error.message}`;
                }
            });

            loadPetPhotos();
            window.addEventListener("focus", loadPetPhotos);
            window.addEventListener("pageshow", loadPetPhotos);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) loadPetPhotos();
            });
            const petPhotoRefreshTimer = window.setInterval(loadPetPhotos, 10000);
            window.addEventListener("beforeunload", () => {
                window.clearInterval(petPhotoRefreshTimer);
            });

            document.querySelector("#remove-profile-picture").addEventListener("click", async () => {
                const message = document.querySelector("#profile-message");

                try {
                    const { error: updateError } = await supabase.auth.updateUser({
                        data: { avatar_url: null },
                    });
                    if (updateError) throw updateError;

                    const { data: avatarFiles, error: listError } = await supabase.storage
                        .from(storageBucket)
                        .list(user.id, { limit: 100 });
                    if (listError) throw listError;

                    const avatarPaths = (avatarFiles || [])
                        .map((item) => item.name)
                        .filter((name) => name.startsWith("avatar."));
                    if (avatarPaths.length) {
                        const { error: removeError } = await supabase.storage
                            .from(storageBucket)
                            .remove(avatarPaths.map((name) => `${user.id}/${name}`));
                        if (removeError) throw removeError;
                    }
                } catch (error) {
                    message.textContent = error.message;
                    return;
                }

                document.querySelector("#profile-avatar").src =
                    "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='38' r='18' fill='%23cbd2c4'/%3E%3Cpath d='M18 92a32 32 0 0 1 64 0' fill='%23cbd2c4'/%3E%3C/svg%3E";
                document.querySelector("#remove-profile-picture").hidden = true;
                message.textContent = "Profile picture removed.";

                if (window.location.pathname.endsWith("account.html")) {
                    window.location.reload();
                }
            });

            document.querySelector("#signout-button").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.replace("auth.html#signin");
            });
        }
    </script>
    <script type="module" src="js/auth-nav.js"></script>
</body>
</html>
